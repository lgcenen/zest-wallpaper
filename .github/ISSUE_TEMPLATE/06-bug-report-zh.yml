name: 缺陷报告
description: 报告可稳定复现、且不局限于单个壁纸包的应用级问题。
title: "[缺陷] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        这个模板用于应用级问题，例如导入失败、库状态异常、切换回退、崩溃或运行时生命周期问题。

        如果问题只和某一张壁纸渲染错误有关，请使用 **壁纸兼容性问题** 模板。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经先搜索过现有 issue。
          required: true
        - label: 我可以在当前最新的 main 分支构建或我能拿到的最新 release 上稳定复现。
          required: true
  - type: dropdown
    id: runtime
    attributes:
      label: 受影响的模块
      options:
        - Scene
        - Video
        - Web
        - Workbench / 本地库管理
        - Player 生命周期 / 窗口
        - 导入 / 持久化
        - 不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本或提交号
      description: 填 release 版本、本地 commit hash 或分支 tip。
      placeholder: "例如：f0c23c1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: "例如：macOS 15.5"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 请尽量写成可稳定复现的步骤，必要时从应用启动开始写。
      placeholder: |
        1. 导入 ...
        2. 应用 ...
        3. 修改属性 ...
        4. 观察 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: dropdown
    id: external_assets
    attributes:
      label: 复现时是否挂载了外部 assets
      description: 本项目不依赖外部 assets 才能启动，但 Scene 兼容性常会因此提升。
      options:
        - "是"
        - "否"
        - 不确定
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息 / 日志
      description: 粘贴相关终端输出、support diagnostics 或错误信息。
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 如果有帮助，请直接拖拽图片或录屏到 issue 中。
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 其他上下文
      description: 例如是否是在某个特定 commit 之后开始出现。
    validations:
      required: false
