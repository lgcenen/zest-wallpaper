name: 安装 / 使用求助
description: 询问如何安装、配置、导入或使用应用。
title: "[求助] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        使用这个模板提安装和使用问题。

        如果你已经确认这是可稳定复现的产品 bug，请改用 **缺陷报告**。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经先读过 README。
          required: true
        - label: 我已经先搜索过现有 issue。
          required: true
  - type: dropdown
    id: topic
    attributes:
      label: 主题
      options:
        - 从源码构建
        - 导入壁纸
        - 挂载外部 assets
        - 切换 / 暂停壁纸
        - 编辑壁纸属性
        - Scene 兼容性预期
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本或提交号
      placeholder: "例如：main @ f0c23c1"
    validations:
      required: false
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: "例如：macOS 15.5"
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: 你想做什么？
      description: 先描述目标工作流。
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: 你已经尝试过什么？
      render: text
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 相关日志或截图
      render: text
    validations:
      required: false
