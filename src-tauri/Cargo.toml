[package]
name = "wallpaper-workbench"
version = "0.1.0"
description = "Zest Wallpaper for imported Wallpaper Engine projects"
authors = ["lin"]
edition = "2021"

[lib]
name = "wallpaper_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
anyhow = "1"
bcndecode = "=0.2.0"
chrono = { version = "=0.4.38", features = ["clock", "serde"] }
image = { version = "=0.25.1", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
glam = "0.29"
lz4_flex = { version = "=0.13.0", default-features = false, features = ["safe-decode", "std"] }
quickjs-rs = "=0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
rustfft = "6.4.1"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSAttributedString", "NSBitmapImageRep", "NSColor", "NSEvent", "NSFont", "NSFontDescriptor", "NSGraphicsContext", "NSImageRep", "NSParagraphStyle", "NSRunningApplication", "NSScreen", "NSShadow", "NSStringDrawing", "NSText", "NSView", "NSWindow", "NSWorkspace", "objc2-core-graphics"] }
objc2-avf-audio = { version = "0.3.2", features = ["AVAudioPlayer"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVAnimation", "AVAsset", "AVAssetImageGenerator", "AVAudioPlayer", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVPlayerLooper", "objc2-core-graphics", "objc2-core-media", "objc2-core-video"] }
objc2-av-kit = { version = "0.3.2", default-features = false, features = ["AVPlayerView", "objc2-app-kit", "objc2-av-foundation"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGWindowLevel"] }
objc2-core-text = { version = "0.3.2", features = ["CTFontDescriptor", "CTFontManager"] }
objc2-core-media = { version = "0.3.2", features = ["CMTime"] }
objc2-core-video = { version = "0.3.2", features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVMetalTexture", "CVMetalTextureCache", "CVPixelBuffer", "CVReturn", "objc2", "objc2-metal"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDictionary", "NSError", "NSAttributedString", "NSGeometry", "NSString", "NSURL", "NSURLRequest", "NSValue", "std"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLAllocation", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLTexture", "MTLTypes"] }
objc2-metal-kit = { version = "0.3.2", default-features = false, features = ["MTKView", "objc2-app-kit", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CABase", "CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-metal"] }
objc2-web-kit = { version = "0.3.2", features = ["WKNavigation", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration", "block2", "objc2-app-kit"] }
screencapturekit = { version = "1.5.4", features = ["macos_13_0"] }
